<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Station — 全自動影音生產線</title>
  <style>
    :root{
      --bg:#0a0e17; --panel:#121826; --panel2:#1a2235; --line:#243049;
      --txt:#e6edf6; --muted:#8a9bb5; --accent:#4f8cff; --accent2:#22d3a6;
      --warn:#f5a623; --bad:#ff5c5c;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:"Segoe UI",-apple-system,"Microsoft YaHei",sans-serif;
      background:var(--bg);color:var(--txt);line-height:1.5}
    header{padding:20px 28px;border-bottom:1px solid var(--line);
      display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
    h1{font-size:20px;margin:0;letter-spacing:.5px}
    h1 .dot{color:var(--accent2)}
    .feat{display:flex;gap:8px;flex-wrap:wrap;font-size:12px}
    .chip{background:var(--panel2);border:1px solid var(--line);padding:4px 10px;border-radius:20px;color:var(--muted)}
    .chip b{color:var(--txt);font-weight:600}
    .chip.free b{color:var(--accent2)}
    .chip.cloud b{color:var(--accent)}
    main{max-width:1100px;margin:0 auto;padding:24px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    @media(max-width:820px){.grid{grid-template-columns:1fr}}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
    .card h2{margin:0 0 12px;font-size:15px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:1px}
    textarea{width:100%;min-height:200px;background:var(--panel2);color:var(--txt);
      border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px;resize:vertical}
    input[type=text],select{width:100%;background:var(--panel2);color:var(--txt);
      border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px}
    select{cursor:pointer}
    button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 18px;
      font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
    button:hover{filter:brightness(1.1)}
    button:disabled{opacity:.5;cursor:not-allowed}
    button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
    button.ghost:hover{color:var(--txt);border-color:var(--accent)}
    button.small{padding:6px 12px;font-size:12px}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .job{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--panel2)}
    .job .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
    .job .title{font-weight:600}
    .badge{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--line)}
    .badge.done{color:var(--accent2);border-color:var(--accent2)}
    .badge.run{color:var(--warn);border-color:var(--warn)}
    .badge.fail{color:var(--bad);border-color:var(--bad)}
    .bar{height:6px;background:#0a0e17;border-radius:6px;margin-top:8px;overflow:hidden}
    .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:.3s}
    video{width:100%;border-radius:10px;margin-top:8px;background:#000}
    .hint{color:var(--muted);font-size:12px;margin-top:6px}
    .actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
    .empty{color:var(--muted);font-size:13px;text-align:center;padding:20px}
    .mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
    .stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px}
    .stat .num{font-size:26px;font-weight:700;color:var(--txt)}
    .stat .num.good{color:var(--accent2)}
    .stat .num.warn{color:var(--warn)}
    .stat .lbl{font-size:12px;color:var(--muted);margin-top:4px}
    .stat .sub{font-size:11px;color:var(--muted);margin-top:6px}
    .brands{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
    .brands .b{display:inline-block;background:var(--panel2);border:1px solid var(--line);
      border-radius:20px;padding:4px 10px;font-size:12px;color:var(--muted)}
    .brands .b b{color:var(--accent)}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
      background:var(--accent2);color:#04140e;padding:10px 18px;border-radius:10px;
      font-size:13px;font-weight:600;opacity:0;transition:.25s;pointer-events:none}
    .toast.show{opacity:1}
    .examples{margin-top:10px}
    .examples .b{display:inline-block;background:var(--panel2);border:1px solid var(--line);
      border-radius:20px;padding:4px 10px;font-size:12px;color:var(--muted);cursor:pointer;margin:3px}
    .examples .b:hover{color:var(--txt);border-color:var(--accent)}
  </style>
</head>
<body>
<header>
  <h1>AI Station <span class="dot">●</span> 全自動影音生產線</h1>
  <div class="feat" id="feat"></div>
</header>
<main>
  <div class="grid">
    <div class="card">
      <h2>① 提交腳本 (Script)</h2>
      <input type="text" id="title" placeholder="影片標題 (選填)" />
      <select id="brand">
        <option value="">品牌預設：預設（無開場 slate）</option>
      </select>
      <textarea id="script" placeholder="在此貼上你的腳本。每一句話會自動切成一個鏡頭，並生成語音與畫面。&#10;&#10;例：&#10;宇宙浩瀚無垠，充滿了無數未解之謎。&#10;從黑洞到暗物質，科學家持續探索這片神祕領域。&#10;今天我們就來看看，人類對宇宙的理解到了哪一步。"></textarea>
      <div class="examples" id="examples"></div>
      <div style="margin-top:10px" class="row">
        <button id="go">▶ 一鍵生成影片</button>
        <button id="dna" class="ghost small">貼上 DNA 範本</button>
        <span class="hint" id="hint">預設使用免費引擎 (edge-tts + ffmpeg + Pillow)</span>
      </div>
    </div>
    <div class="card">
      <h2>② 作業監控 (Jobs)</h2>
      <div id="jobs"><div class="empty">尚無作業</div></div>
    </div>
    <div class="card" style="grid-column:1/-1">
      <h2>③ 生產線指標 (Metrics)</h2>
      <div id="metrics" class="mgrid"><div class="empty">載入中…</div></div>
    </div>
  </div>
</main>
<div class="toast" id="toast"></div>

<!-- TypeScript bundle will be injected by Vite during build -->
<script type="module" src="/src/main.ts"></script>
</body>
</html>
