[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-station"
version = "0.1.0"
description = "AI Station - full-automatic video production pipeline (control center)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pillow",
    "numpy",
    "edge-tts",
    "httpx",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pyyaml",
]
# Optional cloud extras — only needed when the corresponding key is set.
s3 = ["boto3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.scripts]
ai-station = "src.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "cloud: real cloud-provider integration (Runway/ElevenLabs); runs only when API keys are present",
]
