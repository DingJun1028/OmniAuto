# AI Station reverse proxy — drop into /etc/nginx/sites-available/
# and symlink to /etc/nginx/sites-enabled/, then `nginx -t && systemctl reload nginx`.
#
# Prereq: DNS A/AAAA for aistation.esggo.co -> VPS IP.
# For HTTPS, run `sudo certbot --nginx -d aistation.esggo.co` after this is live.

server {
    listen 80;
    server_name aistation.esggo.co;

    # Upload/large video responses
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # WebSocket / SSE support (FastAPI TestClient / future live logs)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

