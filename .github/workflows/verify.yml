name: Verify live AI Station (free path end-to-end)

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Domain/FQDN the service listens on (used only for the log line)"
        required: false
        default: "aistation.esggo.co"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write SSH private key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Submit a DNA script and poll until done
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$USER@$HOST" bash -c "'
            set -e
            SCRIPT=\"【場景】城市不是替人民設計。【衝突】市民的需求常被專家最佳化取代。【洞察】公共價值來自共創。【方法】用三個共創問題啟動參與。【反思】你上一次被詢問，是什麼時候？\"
            BODY=$(python3 -c \"import json,sys; print(json.dumps({\\\"title\\\":\\\"verify-run\\\",\\\"script\\\":sys.argv[1],\\\"brand_preset\\\":\\\"sushi_dr\\\"}))\" \"$SCRIPT\")
            JID=$(curl -fsS -X POST http://127.0.0.1:8000/api/jobs -H \"Content-Type: application/json\" -d \"$BODY\" | python3 -c \"import sys,json; print(json.load(sys.stdin)['\''job_id'\''])\")
            echo \"submitted job=$JID\"
            for i in $(seq 1 60); do
              ST=$(curl -fsS http://127.0.0.1:8000/api/jobs/$JID | python3 -c \"import sys,json; print(json.load(sys.stdin)['\''status'\''])\")
              echo \"poll $i: $ST\"
              if [ \"$ST\" = \"done\" ] || [ \"$ST\" = \"failed\" ]; then break; fi
              sleep 3
            done
            # Report final state + whether a video file actually exists on disk.
            curl -fsS http://127.0.0.1:8000/api/jobs/$JID
            F=$(curl -fsS http://127.0.0.1:8000/api/jobs/$JID | python3 -c \"import sys,json; print(json.load(sys.stdin).get('\''result'\'','''{}'').get('\''file'\'',''''\''))\")
            if [ -n \"$F\" ]; then
              echo \"result_file=$F\"
              ls -l \"$F\" 2>/dev/null && echo VIDEO_EXISTS || echo VIDEO_MISSING
            fi
          '"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
