name: Verify live AI Station (free path end-to-end)

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Domain/FQDN the service listens on (used only for the log line)"
        required: false
        default: "aistation.esggo.co"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write SSH private key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Ship verifier + run it on the VPS
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -az -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./deploy/verify_live.py "$USER@$HOST:~/aistation/deploy/verify_live.py"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$USER@$HOST" \
            "cd ~/aistation/deploy && python3 verify_live.py"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
