name: nginx favicon v4

on: workflow_dispatch

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: add favicon to nginx
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" cat /etc/nginx/sites-available/aistation.esggo.co.conf > /tmp/current_nginx.conf
          python3 scripts/fix-nginx-favicon.py /tmp/current_nginx.conf
          cat /tmp/current_nginx.conf | ssh -i ~/.ssh/deploy_key "$USER@$HOST" sudo tee /etc/nginx/sites-available/aistation.esggo.co.conf > /dev/null
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" 'sudo nginx -t && sudo systemctl reload nginx && echo "deployed"'
