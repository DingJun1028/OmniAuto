name: 🔧 nginx favicon fix v2

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix nginx favicon location
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" bash -c "'
            sed -i \"s|location / {|location = /favicon.ico {\\n        root /var/www/aistation;\\n        expires 30d;\\n        access_log off;\\n    }\\n\\n    location / {|\" /etc/nginx/sites-available/aistation.esggo.co.conf
            nginx -t && systemctl reload nginx && echo \"OK: favicon route added\"
          '"
