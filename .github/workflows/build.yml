name: Build & publish AI Station image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Map the secret into an env var so it can be referenced in `with:` and `if:`.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg (pipeline + API tests render with it)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install deps + run pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (only if credentials are set)
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (and push to Docker Hub when credentials exist)
        uses: docker/build-push-action@v6
        with:
          context: .
          # CI-only run (no secrets): build + load the image to prove it builds.
          # With secrets: build + push to Docker Hub as <user>/aistation:latest.
          push: ${{ env.DOCKERHUB_USERNAME != '' }}
          load: ${{ env.DOCKERHUB_USERNAME == '' }}
          tags: >-
            ${{
              env.DOCKERHUB_USERNAME != '' &&
              format('{0}/aistation:latest', env.DOCKERHUB_USERNAME)
              || 'aistation:ci'
            }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
