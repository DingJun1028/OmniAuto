name: Build AI Station image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (only if credentials are set)
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (push to Docker Hub only when credentials exist)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          tags: >-
            ${{
              secrets.DOCKERHUB_USERNAME != '' &&
              format('{0}/aistation:latest', secrets.DOCKERHUB_USERNAME)
              || 'aistation:ci'
            }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # `load: true` for the no-push (CI-only) case so the build is still exercised
          load: ${{ secrets.DOCKERHUB_USERNAME == '' }}
