name: deploy favicon file

on: workflow_dispatch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: copy favicon to VPS
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#10243f"/><text x="16" y="22" text-anchor="middle" font-size="20" fill="#c9a24b" font-family="sans-serif">S</text></svg>' | ssh -i ~/.ssh/deploy_key "$USER@$HOST" sudo tee /var/www/aistation/favicon.ico > /dev/null
          echo "favicon deployed"
